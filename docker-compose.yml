networks:
  dev-network:
    external: true
    name: dev-network

services:
  # ── PHP-FPM App ─────────────────────────────────────────────
  travels-app:
    image: devharbor/php83-fpm:latest
    container_name: travels-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - dev-network
    labels:
      devharbor.enable: "true"
      devharbor.host:   "travels.test"
      devharbor.type:   "laravel"
      devharbor.php:    "travels-app"
      devharbor.root:   "/var/www/projects/dharamshalatravels1/public"
      devharbor.vite:   "travels-vite"

  # ── Queue Worker ────────────────────────────────────────────
  travels-queue:
    image: devharbor/php83-fpm:latest
    container_name: travels-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on: [travels-app]
    networks:
      - dev-network

  # ── Scheduler ───────────────────────────────────────────────
  travels-scheduler:
    image: devharbor/php83-fpm:latest
    container_name: travels-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on: [travels-app]
    networks:
      - dev-network

  # ── Vite HMR ────────────────────────────────────────────────
  travels-vite:
    image: node:20-alpine
    container_name: travels-vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
    networks:
      - dev-network
